[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelspec"
version = "0.2.0"
description = "Compile business standards into executable labeling rules."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "urllib3>=1.26,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
labelspec = "labelspec.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["labelspec*"]

[tool.setuptools.package-data]
labelspec = ["demo/*.md", "demo/*.csv", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
